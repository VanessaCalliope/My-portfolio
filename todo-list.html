<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список дел</title>
<style>
  :root { --bg: #E4F3EC; --card: #fff; --ink: #2B3F37; --mute: #9DB5AA; --mint: #6FC2A5; --soft: #F0F9F5; }
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: start center; padding: 12vh 20px;
         background: linear-gradient(160deg, var(--bg), #F7FCF9); color: var(--ink); }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 28px; padding: 28px;
         box-shadow: 0 20px 50px #6FC2A533; }
  h1 { font-size: 1.6rem; font-weight: 600; }
  small { display: block; color: var(--mint); margin: 4px 0 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 18px; }
  input[type=text] { flex: 1; border: 0; outline: 0; background: var(--soft); border-radius: 99px; padding: 12px 18px; color: var(--ink); }
  .row button { width: 44px; border: 0; border-radius: 50%; background: var(--mint); color: #fff; font-size: 1.4rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-radius: 14px; }
  li:hover { background: var(--soft); }
  .box { width: 22px; height: 22px; border: 2px solid var(--mint); border-radius: 50%; cursor: pointer; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; }
  .done .box { background: var(--mint); }
  .done .box::after { content: '✓'; }
  .done span { color: var(--mute); text-decoration: line-through; }
  span { flex: 1; word-break: break-word; }
  .x { border: 0; background: none; color: var(--mute); cursor: pointer; opacity: 0; }
  li:hover .x { opacity: 1; }
  .empty { color: var(--mute); text-align: center; padding: 16px; }
</style>
</head>
<body>
<main>
  <h1>Сегодня 🌿</h1>
  <small id="count"></small>
  <div class="row">
    <input type="text" id="input" placeholder="Что нужно сделать?" maxlength="120" autocomplete="off">
    <button type="button" id="add">+</button>
  </div>
  <ul id="list"></ul>
</main>

<script>
  const $ = id => document.getElementById(id);
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem('todos') || '[]'); } catch (e) {}

  function render() {
    try { localStorage.setItem('todos', JSON.stringify(tasks)); } catch (e) {}
    $('list').innerHTML = tasks.length ? '' : '<li class="empty">Пока пусто — добавь первое дело</li>';
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.innerHTML = '<div class="box"></div><span></span><button class="x">✕</button>';
      li.querySelector('span').textContent = t.text;
      li.querySelector('.box').onclick = () => { t.done = !t.done; render(); };
      li.querySelector('.x').onclick = () => { tasks.splice(i, 1); render(); };
      $('list').append(li);
    });
    $('count').textContent = tasks.length ? `${tasks.filter(t => t.done).length} из ${tasks.length} выполнено` : '';
  }

  function add() {
    const text = $('input').value.trim();
    if (text) tasks.push({ text, done: false });
    $('input').value = '';
    render();
  }
  $('add').onclick = add;
  $('input').onkeydown = e => { if (e.key === 'Enter') add(); };

  render();
</script>
</body>
</html>
